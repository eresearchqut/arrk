- abbreviated_name: BSA
  allow_multiple: false
  calculation: |-
    var height = context.arrkGrowthHeight;
    var weight = context.arrkGrowthWeigh;

    var validHeight = height && !isNaN(height) && height > 0;
    var validWeight = weight && !isNaN(weight) && weight > 0;

    var bsa, bsaRounded;

    if (validHeight && validWeight) {
      bsa = Math.sqrt((height * weight)/3600);
      bsaRounded = Math.round(bsa * 100) / 100;
    }

    context.result = bsa === undefined ? "Enter height and weight" : bsaRounded;
