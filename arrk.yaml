- abbreviated_name: Age at Diag
  allow_multiple: false
  calculation: |-
    function pluralise(singular, actual) {
        return actual + ' ' + singular + (actual > 1 ? 's' : '');
    }

    function stringify(days, months, years) {
        var date_string = '';

        if (years > 0) {
            date_string += pluralise('year', years);
        }

        if (months > 0 && years < 1) {
            date_string += (date_string ? ', ' : '') + pluralise('month', months);
        }

        if (days > 0 && years < 1 && months < 1) {
            date_string += (date_string ? ', ' : '') + pluralise('day', days);
        }

        return date_string;
    }

    function convert(ms) {
        var DAYS_IN_MONTH = 30.47;
        var DAYS_IN_YEAR = 365;
        var MONTHS_IN_YEAR = 12;
        var days = ms / 1000 / 60 / 60 / 24;
        var months = Math.floor(days / DAYS_IN_MONTH);
        var years = Math.floor(days / DAYS_IN_YEAR);


        if (years >= 1) {
            months = months - (years * MONTHS_IN_YEAR);
            days = days - (years * DAYS_IN_YEAR);
        }

        if (months >= 1) {
            days = days - (months * DAYS_IN_MONTH);
        }

        days = Math.round(days);

        return stringify(days, months, years);

    }

    var firstDiagnosed = patient.clinicalData.arrkDiagnosticsCFG.arrkDiagnostics.arrkDiagnostictimeline.arrkDTdiagmade;
    var firstDiagnosedDate = patient.clinicalData.arrkDiagnosticsCFG.arrkDiagnostics.arrkDiagnostictimeline.arrkDTSelDate2;
    var dateOfBirth = patient.dateOfBirth;

    if (firstDiagnosed === "Before Birth") {
        context.result = "0";
    } else {

        if (firstDiagnosedDate && dateOfBirth) {
            var parsedDOB = Date.parse(dateOfBirth);
            var parsedFDD = Date.parse(firstDiagnosedDate);

            if (parsedFDD < parsedDOB) {
                context.result = "0";
            } else {
                var duration = parsedFDD - parsedDOB;
                context.result = convert(duration);
            }

        }

        if (context.result === undefined) {
            context.result = "N/A";
        }
    }
  calculation_query: |-
    dateOfBirth
    clinicalData {
        arrkDiagnosticsCFG {
            arrkDiagnostics {
                arrkDiagnostictimeline {
                    arrkDTdiagmade
                    arrkDTSelDate2
                }
            }
        }
    }
  code: arrkASPAgeatDiag
  datatype: calculated
  desc: ''
  important: false
  instructions: If this is N/A , please fill Date of Diagnosis in the Diagnostic Form
  is_required: false
  max_length: null
  max_value: null
  min_value: null
  name: Age at Diagnosis
  pattern: ''
  pv_group: null
  widget_name: ''
  widget_settings: '{}'
